name: Stable Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install pinned static-analysis tools
        run: |
          set -euo pipefail
          TOOLS_DIR="$RUNNER_TEMP/static-tools"
          scripts/ci-install-tools.sh "$TOOLS_DIR"
          echo "$TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Verify release gates before secrets
        run: |
          set -euo pipefail
          scripts/release-preflight.sh
          scripts/test-release.sh
          swift test \
            --scratch-path "$RUNNER_TEMP/preflight-test-build" \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors
          scripts/build-app.sh \
            --release \
            --scratch-path "$RUNNER_TEMP/preflight-app-build" \
            --output "$RUNNER_TEMP/preflight-ICloudGuard.app"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE:?MACOS_CERTIFICATE_P12_BASE64 is required}"
          : "${CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD is required}"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "CODESIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Provision isolated notarization profile
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          scripts/provision-notary-profile.sh create \
            --state-dir "$RUNNER_TEMP/icloud-guard-notary-profile" \
            --profile "icloud-guard-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --env-file "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${CODESIGN_IDENTITY:?CODESIGN_IDENTITY is required}"
          scripts/release-gate.sh \
            --channel stable \
            --tag "$GITHUB_REF_NAME" \
            --output-dir "$RUNNER_TEMP/release" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --sign-identity "$CODESIGN_IDENTITY" \
            --keychain "$CODESIGN_KEYCHAIN"

      - name: Create authenticated stable update feed
        if: vars.UPDATE_FEED_ENABLED == 'true'
        env:
          UPDATE_FEED_ORIGIN: ${{ vars.UPDATE_FEED_ORIGIN }}
          UPDATE_FEED_KEY_ID: ${{ vars.UPDATE_FEED_KEY_ID }}
          UPDATE_FEED_PUBLIC_KEY_X963_BASE64: ${{ vars.UPDATE_FEED_PUBLIC_KEY_X963_BASE64 }}
          UPDATE_FEED_PRIVATE_KEY_PEM_BASE64: ${{ secrets.UPDATE_FEED_PRIVATE_KEY_PEM_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${UPDATE_FEED_ORIGIN:?UPDATE_FEED_ORIGIN is required}"
          : "${UPDATE_FEED_KEY_ID:?UPDATE_FEED_KEY_ID is required}"
          : "${UPDATE_FEED_PUBLIC_KEY_X963_BASE64:?UPDATE_FEED_PUBLIC_KEY_X963_BASE64 is required}"
          : "${UPDATE_FEED_PRIVATE_KEY_PEM_BASE64:?UPDATE_FEED_PRIVATE_KEY_PEM_BASE64 is required}"
          VERSION="$(scripts/version.sh)"
          KEY_PATH="$RUNNER_TEMP/update-feed-private.pem"
          (umask 077; printf '%s' "$UPDATE_FEED_PRIVATE_KEY_PEM_BASE64" | base64 --decode > "$KEY_PATH")
          GENERATED_AT="$(date +%s)"
          EXPIRES_AT="$((GENERATED_AT + 604800))"
          scripts/update-feed.sh create \
            --manifest "$RUNNER_TEMP/release/ICloudGuard-$VERSION.zip.json" \
            --artifact "$RUNNER_TEMP/release/ICloudGuard-$VERSION.zip" \
            --update-origin "$UPDATE_FEED_ORIGIN" \
            --channel stable \
            --team-id "$APPLE_TEAM_ID" \
            --key-id "$UPDATE_FEED_KEY_ID" \
            --private-key "$KEY_PATH" \
            --generated-at "$GENERATED_AT" \
            --expires-at "$EXPIRES_AT" \
            --output "$RUNNER_TEMP/release/feed-v1.json"
          scripts/update-feed.sh verify \
            --feed "$RUNNER_TEMP/release/feed-v1.json" \
            --update-origin "$UPDATE_FEED_ORIGIN" \
            --channel stable \
            --team-id "$APPLE_TEAM_ID" \
            --key-id "$UPDATE_FEED_KEY_ID" \
            --public-key-x963-base64 "$UPDATE_FEED_PUBLIC_KEY_X963_BASE64" \
            --checked-at "$GENERATED_AT"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP"/release/* \
            --verify-tag \
            --generate-notes \
            --title "iCloud Guard $GITHUB_REF_NAME"

      - name: Remove notarization credentials
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/update-feed-private.pem"
          if [[ -x scripts/provision-notary-profile.sh ]]; then
            scripts/provision-notary-profile.sh cleanup \
              --state-dir "$RUNNER_TEMP/icloud-guard-notary-profile"
          fi
